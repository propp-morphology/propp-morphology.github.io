<style>
/* Layout: a periodic table of the tale. One grotesk (it carries Latin, Cyrillic, Greek and Propp's arrows), five sizes,
   no italics; hierarchy comes from weight, position and the grid. The opening band takes its colours from the 1928
   Academia cover. Form carries the meaning: a solid line is a pair Propp names, a dashed line is a correspondence
   he states; the selected function is filled, its pair is outlined. */
:root {
  --paper: #f5f5f1; --ink: #1e2230; --muted: #5b606d; --rule: #d4d3cb; --faint: #e8e7e1;
  --accent: #2c51c9; --wash: #dde4f8;
  --band: #1f2330; --band-ink: #ece4cf; --band-muted: #a8a492; --spine: #e6dcc3; --spine-ink: #1f2330;
  --font: "Geologica", "Segoe UI", system-ui, sans-serif;
  --s1: 13px; --s2: 16px; --s3: 22px; --s4: 28px; --s5: clamp(34px, 5.4vw, 60px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #15181f; --ink: #e8e3d5; --muted: #a2a39b; --rule: #363a46; --faint: #22262f;
  --accent: #93a8ff; --wash: #28325c; --band: #0d0f14; --band-ink: #ece4cf; --band-muted: #9c9887;
  --spine: #d9cfb5; --spine-ink: #1f2330; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #15181f; --ink: #e8e3d5; --muted: #a2a39b; --rule: #363a46; --faint: #22262f;
  --accent: #93a8ff; --wash: #28325c; --band: #0d0f14; --band-ink: #ece4cf; --band-muted: #9c9887;
  --spine: #d9cfb5; --spine-ink: #1f2330; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: var(--s2); line-height: 1.55; font-weight: 400; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1180px; margin: 0 auto; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
h2 { font-size: var(--s4); line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
h3, h4 { font-size: var(--s2); font-weight: 700; }
.meta { font-size: var(--s1); color: var(--muted); }
.pg { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
sup, sub { font-size: 0.66em; line-height: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.linkbtn { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline;
  text-decoration-color: var(--rule); text-underline-offset: 3px; }
.linkbtn:hover { text-decoration-color: currentColor; }

/* ---------- the cover band ---------- */
.band { background: var(--band); color: var(--band-ink); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.band .inner { display: grid; grid-template-columns: 112px minmax(0, 1fr); }
.spine { background: var(--spine); color: var(--spine-ink); padding: 36px 14px 36px max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; justify-content: space-between; gap: 40px; font-size: var(--s1); font-weight: 700; line-height: 1.35;
  hyphens: auto; overflow-wrap: anywhere; }
.spine span:last-child { font-weight: 400; }
.cover { padding-block: 40px 36px; display: grid; gap: 26px; min-width: 0; }
.topline { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: var(--s2); font-weight: 700; }
.topline nav { font-weight: 400; color: var(--band-muted); }
.topline nav b { color: var(--band-ink); }
h1 { font-size: var(--s5); line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; max-width: 14ch; }
.lede { max-width: 62ch; }
.lede .pg, .band .meta { color: var(--band-muted); }

/* ---------- formulas: tokens on one line, pairs drawn as arcs ---------- */
.fml { position: relative; padding-top: 58px; width: max-content; min-width: 100%; font-size: var(--s3); }
.fml svg.arcs { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.fml svg.arcs path { fill: none; stroke: currentColor; stroke-width: 1.3; }
.fml svg.arcs path.corr { stroke-dasharray: 3 3.5; }
.fml svg.arcs path.on { stroke: var(--accent); stroke-width: 2.4; }
.band .fml svg.arcs path.on { stroke: var(--band-ink); }
.toks { display: flex; align-items: flex-start; white-space: nowrap; }
.seg { display: grid; gap: 8px; padding-right: 22px; }
.seg + .seg { padding-left: 22px; border-left: 1px solid color-mix(in oklab, currentColor 28%, transparent); }
.seg .row { display: flex; align-items: baseline; gap: 2px; }
.seg .lab { font-size: var(--s1); opacity: 0.72; }
.tk { appearance: none; background: none; border: 0; padding: 1px 4px; cursor: pointer; font-size: inherit; line-height: 1.2; border-radius: 2px; position: relative; }
.tk:hover { background: color-mix(in oklab, currentColor 12%, transparent); }
.tk.neg .s { text-decoration: line-through; text-decoration-thickness: 1px; }
.tk.ours .s { text-decoration: underline dotted; text-underline-offset: 4px; }
.tk.inv::after { content: "⤺"; position: absolute; left: 50%; transform: translateX(-50%); top: -14px; font-size: var(--s1); }
.tk.is-sel { background: var(--wash); color: var(--ink); box-shadow: inset 0 0 0 2px var(--accent); }
.tk.is-mate { box-shadow: inset 0 0 0 1.5px var(--accent); }
.band .tk.is-sel { background: var(--band-ink); color: var(--band); box-shadow: none; }
.band .tk.is-mate { box-shadow: inset 0 0 0 1.5px var(--band-ink); }
.rep { display: inline-flex; align-items: baseline; gap: 2px; }
.rep .br { opacity: 0.55; }
.rep .n { font-size: var(--s1); opacity: 0.75; margin-left: 1px; }
.key { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: var(--s1); align-items: center; }
.band .key { color: var(--band-muted); }
.key svg { vertical-align: middle; margin-right: 6px; }
.key path { fill: none; stroke: currentColor; stroke-width: 1.3; }
.key .box { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; }

/* ---------- page body ---------- */
main { padding-block: 56px 72px; }
.flow { display: grid; gap: 80px; }
.sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.sec > * { min-width: 0; }
.intro { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px 48px; }
.intro > * { min-width: 0; }
.intro > div:first-child { display: grid; gap: 12px; align-content: start; }
.intro p { max-width: 68ch; }
.apparatus { display: grid; gap: 12px; }
.apparatus:empty { display: none; }
.theses { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 36px; }
.theses li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; }
.theses b { font-weight: 800; }

/* ---------- the periodic table of functions ---------- */
.vocab { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
@media (min-width: 1060px) { .vocab.has-entry { grid-template-columns: minmax(0, 1fr) 360px; } .entry { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.groups { display: grid; gap: 24px; min-width: 0; }
.grp { display: grid; gap: 8px; }
.grp h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.grp h3 .meta { font-weight: 400; }
.cards { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.unit { display: flex; border: 1px solid var(--rule); background: var(--paper); }
.unit.pair { border: 1.5px solid var(--ink); }
.unit.corr { border: 1.5px dashed var(--ink); }
.unit .join { align-self: center; color: var(--muted); padding: 0 1px; font-size: var(--s1); }
.or { align-self: center; font-size: var(--s1); color: var(--muted); }
.card { appearance: none; border: 0; background: none; cursor: pointer; text-align: left; width: 108px; min-height: 100px;
  padding: 7px 9px 9px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 0; position: relative; }
.card .r { font-size: var(--s1); color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.2; }
.card .s { font-size: var(--s4); line-height: 1.15; font-weight: 700; }
.card .nm { font-size: var(--s1); line-height: 1.3; hyphens: auto; }
.card .pt { font-size: var(--s1); color: var(--muted); margin-top: 4px; }
.card:hover { background: var(--faint); }
.card.is-sel { background: var(--wash); box-shadow: inset 0 0 0 2px var(--accent); }
.card.is-mate { box-shadow: inset 0 0 0 2px var(--accent); }
.card.is-mate .pt, .card.is-sel .pt { color: var(--accent); }
.card.dim { opacity: 0.3; }
.card.zero { border: 1px dashed var(--rule); cursor: default; }
.entry { border-top: 3px solid var(--ink); padding-top: 16px; display: grid; gap: 12px; min-width: 0; }
.entry .hd { display: flex; gap: 16px; align-items: center; }
.entry .big { font-size: var(--s5); line-height: 1; font-weight: 800; min-width: 1ch; }
.entry h3 { font-size: var(--s3); line-height: 1.2; }
.entry blockquote { margin: 0; }
.entry .line { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.entry .why .ru { color: var(--muted); }
.entry details summary { cursor: pointer; font-size: var(--s1); color: var(--muted); }
.entry dl { margin: 8px 0 0; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; }
.entry dt { color: var(--muted); }
.entry dd { margin: 0; }

/* ---------- the sequence diagram ---------- */
.diagram svg { display: block; }
.diagram text { fill: var(--ink); font-family: var(--font); }
.diagram .mut { fill: var(--muted); }
.diagram .ln { stroke: var(--ink); stroke-width: 2; fill: none; }
.diagram .hair { stroke: var(--rule); stroke-width: 1; fill: none; }
.diagram .arc { stroke: var(--ink); stroke-width: 1.3; fill: none; }
.diagram .arc.corr { stroke-dasharray: 3 3.5; }
.diagram .br { stroke: var(--ink); stroke-width: 1; fill: none; }
.diagram .br.ours { stroke: var(--muted); stroke-dasharray: 2 3; }
.diagram .st { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.diagram .bar { fill: var(--muted); }
.diagram .dot { fill: var(--ink); }
.diagram .hit { fill: transparent; cursor: pointer; }
.diagram .col.is-sel .st { fill: var(--accent); stroke: var(--accent); }
.diagram .col.is-mate .st { stroke: var(--accent); stroke-width: 2.6; }
.diagram .col.is-sel text.sym, .diagram .col.is-mate text.sym { fill: var(--accent); font-weight: 700; }
.diagram .col.is-sel .bar { fill: var(--accent); }
.diagram .col.is-mate .bar { fill: color-mix(in oklab, var(--accent) 55%, var(--paper)); }
.diagram .arc.on { stroke: var(--accent); stroke-width: 2.4; }
.diagram .lane { cursor: pointer; }
.diagram .lane.is-role text { fill: var(--accent); font-weight: 700; }
.diagram .dot.is-role { fill: var(--accent); }
.fork { stroke: var(--ink); stroke-width: 1; fill: none; stroke-dasharray: 4 3; }

/* ---------- tales ---------- */
.talelist { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.talelist button { appearance: none; border: 1px solid var(--rule); background: none; cursor: pointer; padding: 5px 10px; font-size: var(--s1); text-align: left; }
.talelist button .no { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.talelist button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.reader { display: grid; gap: 28px; }
.reader h3 { font-size: var(--s3); }
.reader h3 .meta { font-weight: 400; margin-left: 8px; }
.move { display: grid; gap: 6px; }
.clause { background: var(--faint); padding: 14px 16px; display: grid; gap: 8px; max-width: 78ch; }
.clause .lab { color: var(--muted); font-size: var(--s1); }
.clause mark { background: var(--wash); color: var(--ink); }
.clause .tale { white-space: pre-line; }

/* ---------- moves ---------- */
.mvs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 32px 36px; }
.mvs figure { margin: 0; display: grid; gap: 8px; align-content: start; }
.mvs svg { width: 100%; height: auto; display: block; }
.mvs .ln { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; fill: none; }
.mvs .dash { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; }
.mvs text { font-family: var(--font); font-size: 13px; fill: var(--muted); }
.mvs text.lab { fill: var(--ink); font-weight: 700; }
.mvs .dot { fill: var(--ink); }
.mvs figcaption b { font-weight: 800; margin-right: 4px; }
.mvs .q { color: var(--muted); }

/* ---------- Propp's tables (collapsed, at the end) ---------- */
details.tables { border-top: 1px solid var(--rule); padding-top: 18px; }
details.tables > summary { cursor: pointer; font-size: var(--s3); font-weight: 700; list-style-position: outside; }
details.tables > summary .meta { font-weight: 400; margin-left: 8px; }
details.tables[open] > summary { margin-bottom: 20px; }
.tables-body { display: grid; gap: 18px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
.ctl .opts { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.ctl button { appearance: none; border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.ctl button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
table.grid { border-collapse: separate; border-spacing: 0; font-size: var(--s1); }
.grid th, .grid td { padding: 0; text-align: center; font-weight: 400; }
.grid thead th { color: var(--muted); padding-bottom: 4px; }
.grid thead tr.g th { text-align: left; padding-left: 4px; border-left: 1px solid var(--rule); white-space: nowrap; }
.grid thead tr.f th { font-size: var(--s2); color: var(--ink); }
.grid .rl { position: sticky; left: 0; z-index: 1; background: var(--paper); text-align: left; padding: 0 10px 0 0; min-width: 180px; max-width: 220px; }
.grid .rl button { appearance: none; border: 0; background: none; cursor: pointer; text-align: left; padding: 4px 0; line-height: 1.3; width: 100%; }
.grid .rl .no { color: var(--muted); margin-right: 4px; }
.grid .rl .mv { font-weight: 700; margin-left: 4px; }
.grid td.c { width: 32px; min-width: 32px; height: 30px; border-top: 1px solid var(--faint); font-size: var(--s2); }
.grid td.c.gs, .grid th.gs { border-left: 1px solid var(--rule); }
.grid td.c .e { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--rule); vertical-align: middle; }
.grid td.c .x { font-size: 0.62em; color: var(--muted); vertical-align: sub; margin-left: 1px; }
.grid td.c.neg .v { text-decoration: line-through; }
.grid td.c.ours .v { text-decoration: underline dotted; text-underline-offset: 3px; }
.grid tr.first td, .grid tr.first th { border-top: 1px solid var(--rule); }
.grid .is-sel { background: var(--wash) !important; }
.grid .is-mate { background: color-mix(in oklab, var(--wash) 50%, transparent) !important; }

footer { border-top: 1px solid var(--rule); padding-block: 20px 48px; color: var(--muted); }
footer p { max-width: 90ch; }

@media (max-width: 720px) {
  .band .inner { grid-template-columns: minmax(0, 1fr); }
  .spine { flex-direction: row; padding: 10px 16px; gap: 12px; }
  .spine span:last-child { display: none; }
  .cover { padding-block: 26px 28px; }
  .card { width: 96px; }
  .grid .rl { min-width: 118px; max-width: 140px; }
  .entry .big { font-size: var(--s4); }
  .entry dl { grid-template-columns: 1fr; gap: 0; }
  .entry dd { margin-bottom: 6px; }
}
@media (min-width: 721px) { .cover { padding-left: 40px; } }
@media (prefers-reduced-motion: no-preference) { .card, .tk { transition: background-color .15s, opacity .15s, box-shadow .15s; } }
</style>

  function formula(rows) {
    const items = rows.map((k, i) => ({ k, i, f: k[1], s: clean(kSym(k)) }));

    while (i < items.length) {

  // ===== the sequence diagram =====
  function gapsBefore(i) { let n = 0; for (const g of GROUPS) if (IDX[g.fs[0]] <= i && IDX[g.fs[0]] > 0) n++; return n; }
  function renderScheme() { const box = $("scheme"); box.innerHTML = box.clientWidth >= 720 ? schemeH() : schemeV(box.clientWidth); highlight(); }
  const stSym = f => (f === "VIII" ? "A" : esc(fs_(f)));
  function schemeH() {
    const LW = 112, STEP = 30, GAP = 14, TOP = 30, LINE = 160, LANE0 = 262, LH = 24;
    const x = i => LW + i * STEP + gapsBefore(i) * GAP + STEP / 2;

    });
    PAIRS.forEach(p => {
      const x1 = x(IDX[p.a]), x2 = x(IDX[p.b]), h = Math.min(14 + (x2 - x1) * 0.3, LINE - TOP - 34);
      s += `<path class="arc${p.k === "corr" ? " corr" : ""}" data-pair="${p.a} ${p.b}" d="M${x1} ${LINE - 8}C${x1} ${LINE - 8 - h * 1.3} ${x2} ${LINE - 8 - h * 1.3} ${x2} ${LINE - 8}"/>`;
    });
    GROUPS.forEach(g => { s += `<path class="ln" d="M${x(IDX[g.fs[0]]) - 6} ${LINE}H${x(IDX[g.fs[g.fs.length - 1]]) + 6}"/>`; });

    ROLES.forEach((k, r) => {
      const y = LANE0 + r * LH;

    });
    SEQ.forEach((f, i) => {
      const cx = x(i), v = F[f].t28, bh = v ? Math.max(2, (v / 45) * 46) : 0;
      let g = `<g class="col" data-f="${f}"><rect class="hit" x="${cx - STEP / 2}" y="${TOP + 14}" width="${STEP}" height="${LANE0 + 7 * LH - TOP - 20}"/><title>${f} ${esc(nm(f))}${v ? " · " + esc(L.ofTales(v)) : ""}</title>`;
      g += `<circle class="st" cx="${cx}" cy="${LINE}" r="4.5"/><text class="sym" x="${cx}" y="${LINE + 26}" font-size="16" text-anchor="middle">${stSym(f)}</text>`;
      g += v ? `<rect class="bar" x="${cx - 5}" y="${LINE + 82 - bh}" width="10" height="${bh}"/>` : `<text x="${cx}" y="${LINE + 80}" font-size="13" text-anchor="middle" class="mut">·</text>`;

    s += `<path class="fork" d="M${(h1 + h2) / 2} ${yF}V${yF + 14}H${(m1 + m2) / 2}V${yF}"/>`;

  function schemeV(W) {

      Ln(14, 286, 22) + Ln(126, 216, 62) + `<path class="dash" d="M216 62L246 22"/>` + `<circle class="dot" cx="286" cy="22" r="4"/>` + Tx(14, 14, "I", "lab") + Tx(126, 82, "II", "lab") + Tx(250, 46, s.end),
      Ln(14, 96, 44) + `<path class="ln" d="M96 44L118 22H236L258 44"/><path class="ln" d="M96 44L118 66H236L258 44"/>` + Ln(258, 286, 44) + Tx(126, 14, s.b1) + Tx(126, 86, s.b2)];
    $("mvs").innerHTML = svgs.map((v, i) => `<figure><svg viewBox="0 0 300 92" role="img" aria-label="${esc(L.moveNames[i])}">${v}</svg>
      <figcaption><b>${i + 1}</b>${esc(L.moveNames[i])}</figcaption><div class="q">${esc(L.q(C.moves[i][0]))} <span class="pg">${L.pg(C.moves[i][1])}</span></div></figure>`).join("");
  }

  // ===== one selection, shown everywhere: the function filled, its pair outlined =====
  function highlight() {
    const s = state.sel, sc = s ? col(s) : null, mc = mateCols(s), mcards = mateCards(s);
    document.querySelectorAll(".card[data-f]").forEach(c => {
      c.classList.toggle("is-sel", c.dataset.f === s); c.setAttribute("aria-pressed", String(c.dataset.f === s));
      c.classList.toggle("is-mate", mcards.includes(c.dataset.f));
      c.classList.toggle("dim", !!state.role && !F[c.dataset.f].roles.includes(state.role));
    });
    document.querySelectorAll(".tk").forEach(t => { t.classList.toggle("is-sel", col(t.dataset.f) === sc); t.classList.toggle("is-mate", mc.includes(col(t.dataset.f))); });
    document.querySelectorAll(".diagram .col").forEach(g => { g.classList.toggle("is-sel", g.dataset.f === sc); g.classList.toggle("is-mate", mc.includes(g.dataset.f)); });
    document.querySelectorAll(".diagram .arc").forEach(a => a.classList.toggle("on", !!sc && a.dataset.pair.split(" ").includes(sc)));
    document.querySelectorAll(".diagram .lane").forEach(l => l.classList.toggle("is-role", l.dataset.role === state.role));
    document.querySelectorAll(".diagram .dot").forEach(d => d.classList.toggle("is-role", d.dataset.role === state.role));
    document.querySelectorAll(".grid [data-col]").forEach(c => { c.classList.toggle("is-sel", c.dataset.col === sc); c.classList.toggle("is-mate", mc.includes(c.dataset.col)); });
    document.querySelectorAll(".talelist button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tale === state.tale)));
    redrawAll();
  }
  function select(f) { state.sel = f; renderEntry(); placeEntry(); highlight(); }
  const toggle = f => select(state.sel === f ? null : f);   // select a function again to close its entry

  document.addEventListener("click", e => {
    const t = e.target.closest("button, g.col, g.lane");
    if (!t) return;
    if (t.matches("g.lane")) { state.role = state.role === t.dataset.role ? null : t.dataset.role; highlight(); return; }
    if (t.matches("g.col")) { toggle(t.dataset.f); return; }
    if (t.dataset.role) { state.role = state.role === t.dataset.role ? null : t.dataset.role; highlight(); $("scheme").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    if (t.dataset.go) { select(t.dataset.go); return; }
    if (t.dataset.s) { state.src = t.dataset.s; renderMatrix(); return; }
    if (t.dataset.tale) { state.tale = t.dataset.tale; state.clause = null; renderReader(); if (t.closest("#matrix")) $("tales").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (t.classList.contains("tk") && t.closest("#reader")) {
      const next = { m: t.dataset.m, i: +t.dataset.i };
      state.clause = state.clause && state.clause.m === next.m && state.clause.i === next.i ? null : next;
      state.sel = t.dataset.f; renderEntry(); placeEntry(); renderReader(); return;
    }
    if (t.dataset.f) toggle(t.dataset.f);
  });

  function renderAll() {
    renderStatic(); renderHero(); renderVocab(); renderEntry(); placeEntry(); renderSeqNotes(); renderScheme();
    renderMoves(); renderTaleList(); renderReader(); renderMatrix();
  }
  window.addEventListener("hashchange", () => {
    if (PAGE) return;
    const l = location.hash === "#ru" ? "ru" : "en";
    if (l !== lang) { lang = l; L = T[lang]; C = D.cite[lang]; renderAll(); }
  });
  renderAll();
  let raf = 0, lastW = $("scheme").clientWidth;
  window.addEventListener("resize", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
    const w = $("scheme").clientWidth; if (Math.abs(w - lastW) > 4) { lastW = w; renderScheme(); } redrawAll(); }); });
  $("tables").addEventListener("toggle", highlight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawAll);
})();
</script>
